version: 2

models:
  - name: dim_products
    description: Một dòng là một sản phẩm.
  - name: dim_users
    description: Một dòng là một khách hàng, gồm cả vị trí và thông tin...
  - name: fact_orders
    description: Một dòng là một đơn hàng.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Cancelled', 'Complete', 'Processing', 'Returned', 'Shipped']
  - name: fact_order_items
    description: Một dòng là một món hàng trong đơn, bao gồm cả amount và total_cost.
  - name: fact_shipments
    description: Một dòng là một lô giao hàng.