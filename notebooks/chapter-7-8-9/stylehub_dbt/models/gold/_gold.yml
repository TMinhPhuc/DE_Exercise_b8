version: 2

models:
  - name: daily_revenue
    description: Doanh thu theo ngày
    columns:
      - name: order_date
        description: Ngày đặt hàng
        data_type: 'datetime'
      - name: total_orders
        description: Tổng đơn hàng
        data_type: 'integer'
      - name: revenue
        description: Doanh thu
        data_type: 'float'
  - name: gold_revenue_by_month_category
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['order_month', 'category']
    columns:
      - name: revenue
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: order_month
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null:
              config:
                # Chọn error vì category là khóa chính, không thể chấp nhận tạm thời nên không thể dùng warn
                severity: error