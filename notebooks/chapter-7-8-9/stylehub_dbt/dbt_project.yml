name: stylehub_dbt

profile: stylehub_dbt

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  stylehub_dbt:
    +schema: raw

models:
  stylehub_dbt:
    silver:
      +materialized: table
      +schema: silver

    gold:
      +materialized: table
      +schema: gold